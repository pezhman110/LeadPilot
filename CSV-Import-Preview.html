<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ورود CSV و چرخهٔ عمر داده — LeadPilot</title>
<style>
:root{
  --void:#07060D;--panel:#0F0C1A;--panel2:#151024;--edge:rgba(214,178,102,.16);
  --gold:#D6B266;--amber:#F2CE80;--ink:#ECE7F5;--dim:#9C93B4;
  --ok:#54B78A;--warn:#E4A94C;--bad:#E1685E;--info:#5BB6D6;--idle:#4A4460;
}
*{box-sizing:border-box}
body{margin:0;background:
  radial-gradient(900px 500px at 82% -10%,#1a1330 0%,transparent 60%),
  radial-gradient(700px 500px at 0% 110%,#12182b 0%,transparent 55%),var(--void);
  color:var(--ink);font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;line-height:1.6;min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 60px}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--edge)}
.mark{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--gold),var(--amber));box-shadow:0 0 24px rgba(214,178,102,.4)}
.mark b{font-size:15px}.mark small{display:block;color:var(--dim);font-weight:400;font-size:12px}
.lang{background:transparent;border:1px solid var(--edge);color:var(--ink);border-radius:9px;padding:7px 13px;cursor:pointer;font-family:inherit;font-size:12px}
h2{color:var(--amber);font-size:13px;letter-spacing:1.5px;text-transform:uppercase;margin:22px 0 4px;font-weight:600}
.sub{color:var(--dim);font-size:12.5px;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:13px;padding:14px 16px;margin-bottom:10px}
pre{background:var(--panel2);border:1px solid var(--edge);border-radius:9px;padding:11px 13px;font-size:11px;color:var(--dim);overflow-x:auto;margin:8px 0;font-family:'Space Grotesk',monospace}
.btn{background:linear-gradient(135deg,var(--gold),var(--amber));color:#231703;border:0;border-radius:9px;padding:10px 18px;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.node{font-size:11.5px;padding:6px 11px;border-radius:9px;border:1px solid var(--edge);background:var(--panel2)}
.node.on{border-color:var(--ok);color:var(--ok)}
.arrow{color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.stat{background:var(--panel2);border:1px solid var(--edge);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--amber)}
.stat span{font-size:11px;color:var(--dim)}
.masked{font-family:'Space Grotesk',monospace;font-size:12px;color:var(--ok);margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
.lc h3{margin:0 0 6px;font-size:13px;color:var(--ink)}
.lc p{font-size:11.5px;color:var(--dim);margin:0}
.note{font-size:11.5px;color:var(--dim);border:1px dashed var(--edge);border-radius:11px;padding:11px 15px;margin-top:14px}
.note b{color:var(--amber)}
code{background:rgba(255,255,255,.05);padding:1px 6px;border-radius:5px;color:var(--amber);font-size:11px}
footer{color:var(--dim);font-size:11px;border-top:1px solid var(--edge);margin-top:26px;padding-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark"><div class="logo"></div>
      <div><b id="t_title"></b><small id="t_sub"></small></div></div>
    <button class="lang" onclick="toggleLang()">EN / فارسی</button>
  </header>

  <h2 id="t_iH"></h2>
  <div class="sub" id="t_iS"></div>
  <div class="card">
    <div class="sub" id="t_fmt" style="margin:0 0 4px"></div>
    <pre id="csv"></pre>
    <button class="btn" onclick="run()" id="t_run"></button>
    <div class="flow" id="flow"></div>
    <div class="stats" id="stats"></div>
    <div class="masked" id="masked"></div>
  </div>

  <h2 id="t_lH"></h2>
  <div class="sub" id="t_lS"></div>
  <div class="grid" id="lc"></div>

  <div class="note" id="t_note"></div>
  <footer id="t_foot"></footer>
</div>

<script>
let lang="fa";
const L=(fa,en)=>lang==="fa"?fa:en;
let ran=false;

function run(){ ran=true; render(); }

function render(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="fa"?"rtl":"ltr";
  const set=(id,fa,en)=>{const e=document.getElementById(id);if(e)e.textContent=L(fa,en);};
  set("t_title","ورود CSV/CRM و چرخهٔ عمر داده","CSV/CRM import & data lifecycle");
  set("t_sub","دادهٔ داخلی → ۱۰ شمارهٔ واقعی · با استانداردسازی/رمزنگاری/ManagerOnly","Internal data → 10 real numbers · normalized/encrypted/manager-only");
  set("t_iH","خط ورود CSV","CSV import pipeline");
  set("t_iS","فرمتِ رسمی. مقدارِ خامِ تلفن/ایمیل هرگز در جدولِ Import یا Log ذخیره نمی‌شود.","Official format. Raw phone/email is never stored in the import table or logs.");
  set("t_fmt","فرمت رسمی CSV (ستون‌های اجباری):","Official CSV format (required columns):");
  set("t_run",L("اجرای ورود","Run import"));
  set("t_lH","چرخهٔ عمر داده","Data lifecycle");
  set("t_lS","برای هر مخاطب: از کجا، چرا، برای چه، کِی حذف، چه پیام‌هایی، آیا لغو کرده.","For each contact: where from, why, for what, when to delete, what messages, opted out?");

  document.getElementById("csv").textContent=
"external_id,project_code,phone,email,country_code,source_reference,lawful_source_reference\n"+
"C-1001,P02_BUY_BUSINESS,+971501234567,ali@example.ae,AE,CRM-2026-1001,CONTRACT-CRM-01\n"+
"C-1002,P02_BUY_BUSINESS,+971521234567,sara@demo.ae,AE,CRM-2026-1002,CONTRACT-CRM-01";

  const flowSteps=[L("خواندن Stream","Read stream"),L("اعتبارسنجی","Validate"),L("استانداردسازی","Normalize"),
    L("Hash + حذف تکراری","Hash + dedup"),L("رمزنگاری","Encrypt"),L("پروندهٔ الکترونیکی","E-record"),
    L("ManagerOnly","ManagerOnly"),L("ثبت منبع","Log source")];
  document.getElementById("flow").innerHTML=flowSteps.map((s,i)=>
    `<span class="node ${ran?"on":""}">${s}</span>`+(i<flowSteps.length-1?'<span class="arrow">→</span>':"")).join("");

  document.getElementById("stats").innerHTML= ran ? [
    [2,L("کل سطرها","Total rows")],[2,L("واردشده","Imported")],[0,L("تکراری","Duplicate")],[0,L("نامعتبر","Invalid")]
  ].map(s=>`<div class="stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join("") : "";

  document.getElementById("masked").textContent= ran ?
    L("✓ ذخیره شد: +9715****4567 · +9715****4567 (فقط ماسک‌شده؛ کامل برای مدیر با Reveal+Audit)",
      "✓ Stored: +9715****4567 · +9715****4567 (masked only; full for manager via reveal+audit)") : "";

  const LC=[
    ["ConsentEvidence",L("مدرکِ آرشیویِ رضایت (چه، کِی، چگونه، مرجعِ فایل). بدونِ آن مسیرِ تماس ادامه نمی‌یابد.",
      "Archived consent proof (what, when, how, file ref). Without it, contact path doesn't continue.")],
    ["DataRetentionPolicy",L("هر دادهٔ تماس چه زمانی باید حذف شود؛ مبنای قانونی + مهلتِ نگهداری.",
      "When each contact datum must be deleted; lawful basis + retention window.")],
    ["DeletionRequest",L("درخواستِ فراموشی (PDPL/GDPR): Received→Verifying→Approved→Executed.",
      "Right-to-erasure (PDPL/GDPR): Received→Verifying→Approved→Executed.")]
  ];
  document.getElementById("lc").innerHTML=LC.map(x=>
    `<div class="card lc"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join("");

  document.getElementById("t_note").innerHTML=L(
    "<code>lawful_source_reference</code> مرجعِ قانونیِ نگهداریِ داده است، <b>نه رضایت برای تماسِ فروش</b>. دادهٔ واردشده همچنان <code>ManagerOnly</code> می‌ماند و تماس فقط پس از رضایت و آرشیوِ ConsentEvidence انجام می‌شود.",
    "<code>lawful_source_reference</code> is the lawful basis for holding the data, <b>not consent to sales-contact</b>. Imported data stays <code>ManagerOnly</code>; contact happens only after consent and an archived ConsentEvidence.");

  document.getElementById("t_foot").textContent=L(
    "اصلاح: هدف FirstTenRun «۱۰ شماره تلفنِ یکتا» است، نه مجموعِ تلفن و ایمیل. Resolver با external_id مخاطبِ موجود را پیدا یا جدید می‌سازد؛ dedup با Hash از دریافتِ دوبارهٔ یک شماره جلوگیری می‌کند.",
    "Fix: FirstTenRun targets 10 unique phone numbers, not phone+email combined. Resolver finds/creates a prospect by external_id; hash dedup prevents re-fetching the same number.");
}
function toggleLang(){lang=lang==="fa"?"en":"fa";render();}
render();
</script>
</body>
</html>
